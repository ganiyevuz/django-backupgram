{% extends "admin/base_site.html" %}
{% block content %}
<h1>{{ server.name }} — jobs</h1>
{% if error %}<p class="errornote">{{ error }}</p>{% endif %}
<table><thead><tr><th>ID</th><th>Type</th><th>State</th></tr></thead><tbody>
{% for j in jobs %}<tr><td><a href="{% url 'admin:backupgram_job_detail' server.pk j.id %}">{{ j.id }}</a></td><td>{{ j.type }}</td><td>{{ j.state }}</td></tr>
{% empty %}<tr><td colspan="3">No jobs.</td></tr>{% endfor %}
</tbody></table>
<p><a href="{% url 'admin:backupgram_dashboard' server.pk %}">← Dashboard</a></p>
{% endblock %}
