[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "django-backupgram"
version = "0.1.0"
description = "Django admin control panel for the backupgram REST API (PostgreSQL backups over HTTP)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Jakhongir Ganiev", email = "contact@jakhongir.dev" }
]
keywords = ["django", "postgres", "backup", "admin", "backupgram"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "Django>=5.2",
    "httpx>=0.27",
    "cryptography>=42",
    "django-jazzmin>=3.0.4",
]

[project.urls]
Homepage = "https://github.com/ganiyevuz/django-backupgram"
Repository = "https://github.com/ganiyevuz/django-backupgram"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-django>=4.8",
    "ruff>=0.9.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/backupgram"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]

[tool.ruff.lint.isort]
known-first-party = ["backupgram"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = ["src", "."]
addopts = "-q"
testpaths = ["tests"]
python_files = ["test_*.py"]
